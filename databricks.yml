# This is a Declarative Automation Bundle definition for github_engineering_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: github_engineering_analytics
  uuid: 0200a1f8-a0d8-4e64-ac93-dd43a9b32c35

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: Unity Catalog catalog that contains the Bronze tables
  schema:
    description: Reserved target schema name for future pipeline resources
  github_owner:
    description: GitHub owner whose repository issues are ingested
  github_repository:
    description: GitHub repository whose issues are ingested
  github_token_secret_scope:
    description: Databricks secret scope that contains the GitHub token
  github_token_secret_key:
    description: Key of the GitHub token in the Databricks secret scope

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-bcaf62db-c2ea.cloud.databricks.com
      profile: databricks-dev
    variables:
      catalog: main
      schema: ${workspace.current_user.short_name}

      # Dummy Python Software Foundation Github repository
      # https://github.com/python/software-foundation
      github_owner: psf
      github_repository: requests

      # References only; never tokens
      github_token_secret_scope: github-engineering-analytics
      github_token_secret_key: github-token

  prod:
    mode: production
    workspace:
      host: https://dbc-bcaf62db-c2ea.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/pepijnsch@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/pepijnsch@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: main
      schema: prod

      # Dummy Python Software Foundation Github repository
      # https://github.com/python/software-foundation
      github_owner: psf
      github_repository: requests

      # References only; never tokens
      github_token_secret_scope: github-engineering-analytics
      github_token_secret_key: github-token

    permissions:
      - user_name: pepijnsch@gmail.com
        level: CAN_MANAGE
