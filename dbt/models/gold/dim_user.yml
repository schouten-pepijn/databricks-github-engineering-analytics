version: 2

models:
  - name: dim_user
    description: >
      Current Type-1 GitHub user dimension with one row per global GitHub user
      ID. It is derived from the current Silver Users relation and provides the
      reusable author dimension for the future current-state fact_issue model.

    columns:
      - name: user_key
        description: >
          Deterministic SHA-256 surrogate key derived from user_id. Future facts
          use this as their author foreign key.
        data_tests:
          - not_null
          - unique

      - name: user_id
        description: Stable global GitHub user identifier and natural business key.
        data_tests:
          - not_null
          - unique

      - name: login
        description: Current GitHub login name for the user.
        data_tests:
          - not_null

      - name: user_type
        description: Current GitHub account type, such as User or Bot.
        data_tests:
          - not_null
