version: 2

sources:
  # Python writes and reconciles Silver. These source tests are the contract
  # gate that dbt runs before trusting Silver rows in Gold models.
  - name: silver
    description: >
      Current-state Silver Delta tables written and owned by the Python
      ingestion pipeline. dbt reads these relations but never writes to them.
    # The schema is a variable, so a proof build can read a frozen copy of Silver
    # (see dbt/macros/generate_schema_name.sql for the matching safety net)
    schema: "{{ var('silver_schema', 'github_analytics_silver') }}"

    tables:
      - name: github_issues
        description: >
          One current normalized GitHub issue per repository-scoped issue ID.
          This is the source of the current-state Gold fact_issue relation.
        data_tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - repository_owner
                  - repository_name
                  - issue_id
        columns:
          - name: repository_owner
            description: Repository owner in the issue business key.
            data_tests:
              - not_null
          - name: repository_name
            description: Repository name in the issue business key.
            data_tests:
              - not_null
          - name: issue_id
            description: Stable GitHub issue identifier in the issue business key.
            data_tests:
              - not_null
          - name: author_user_id
            description: Stable global GitHub user identifier of the Issue author.
            data_tests:
              - not_null

      - name: github_users
        description: >
          One current normalized GitHub user per global GitHub user ID.
          This is the future source of the Gold dim_user relation.
        columns:
          - name: user_id
            description: Stable global GitHub user identifier.
            data_tests:
              - not_null
              - unique

      - name: github_labels
        description: >
          One current label definition per repository-scoped label ID.
          This describes labels themselves, not their issue assignments.
        data_tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - repository_owner
                  - repository_name
                  - label_id
        columns:
          - name: repository_owner
            description: Repository owner in the label business key.
            data_tests:
              - not_null
          - name: repository_name
            description: Repository name in the label business key.
            data_tests:
              - not_null
          - name: label_id
            description: Stable GitHub label identifier in the label business key.
            data_tests:
              - not_null

      - name: github_issue_labels
        description: >
          Current issue-to-label relationships. One row represents one label
          currently assigned to one repository-scoped issue. This is the future
          source of Gold bridge_issue_label.
        data_tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - repository_owner
                  - repository_name
                  - issue_id
                  - label_id
        columns:
          - name: repository_owner
            description: Repository owner in the relationship business key.
            data_tests:
              - not_null
          - name: repository_name
            description: Repository name in the relationship business key.
            data_tests:
              - not_null
          - name: issue_id
            description: GitHub issue identifier in the relationship business key.
            data_tests:
              - not_null
          - name: label_id
            description: GitHub label identifier in the relationship business key.
            data_tests:
              - not_null
  # Python also owns the control tables. The snapshot model read them to learn
  # which runs a manifest locked and when those runs finished. dbt never writes
  # to them.
  - name: control
    description: >
      Pipeline state written by the Python pipeline. Used only to read replay
      manifests and run timestamps for the daily snapshot models.
    schema: github_analytics_control

    tables:
      - name: replay_manifests
        description: >
          description: >
          One immutable row per replay manifest. successful_run_ids lists the
          runs whose Bronze rows the manifest locked.
        columns:
          - name: manifest_id
            description: Content-hash identifier of the manifest.
            data_tests:
              - not_null
              - unique

      - name: pipeline_runs
        description: >
          One row per pipeline attempt, with its status and start and end times.
        columns:
          - name: run_id
            description: Databricks job run ID of the attempt.
            data_tests:
              - not_null
              - unique

  # Append-only raw GitHub evidence. The snapshot models read it at the Delta
  # version a manifest locked, so a later append cannot change a snapshot.
  - name: bronze
    description: >
      Raw GitHub Issue observations written by the Python pipeline. dbt reads
      them with Delta time travel and never writes to them.
    schema: github_analytics_bronze

    tables:
      - name: github_issues_raw
        description: >
          One row per observation of an Issue, with the raw GitHub JSON payload.
          An Issue can appear in many rows, one per run that read identifier.
