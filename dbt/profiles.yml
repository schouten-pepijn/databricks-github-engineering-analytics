github_engineering_analytics:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: "{{ env_var('DATABRICKS_TEST_CATALOG') }}"
      schema: github_analytics_gold
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_SQL_HTTP_PATH') }}"
      auth_type: oauth
      threads: 2
