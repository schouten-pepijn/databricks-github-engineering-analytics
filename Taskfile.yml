version: "3"
dotenv:
  - .env

tasks:
  setup:
    desc: Install development dependencies
    env:
      UV_LINK_MODE: copy
    cmds:
      - uv sync --dev

  lint:
    desc: Run Ruff lint checks
    cmds:
      - uv run ruff check .

  format:
    desc: Format Python files with Ruff
    cmds:
      - uv run ruff format .

  format:check:
    desc: Check Python formatting without changing files
    cmds:
      - uv run ruff format --check .

  typecheck:
    desc: Check Python types with basedpyright (errors only)
    cmds:
      - uv run basedpyright --level error .

  test:unit:
    desc: Run unit tests without Databricks
    cmds:
      - uv run pytest -m "not integration" -v

  test:integration:
    desc: Run opt-in Databricks integration tests
    env:
        RUN_DATABRICKS_INTEGRATION_TESTS: "1"
    requires:
      vars:
        - DATABRICKS_TEST_CATALOG
    cmds:
      - uv run pytest -m integration -v

  test:reset-data:
    desc: "DESTRUCTIVE: truncate known tables in the confirmed test catalog"
    requires:
      vars:
        - DATABRICKS_TEST_CATALOG
        - CONFIRM_TEST_CATALOG_RESET
    cmds:
      - uv run python -m github_engineering_analytics.common.catalog_reset

  dev:reset-data:
    desc: "DESTRUCTIVE: truncate known tables in the confirmed DEV catalog"
    requires:
      vars:
        - DATABRICKS_DEV_CATALOG
        - CONFIRM_DEV_CATALOG_RESET
    cmds:
      - >-
        uv run python -m github_engineering_analytics.common.catalog_reset
        --catalog-environment-variable DATABRICKS_DEV_CATALOG
        --confirmation-environment-variable CONFIRM_DEV_CATALOG_RESET

  test:reset-all:
    desc: >-
      DESTRUCTIVE: like test:reset-data, and also truncate the dbt-owned Gold
      relations, the daily snapshot tables and the replay manifests in the
      confirmed test catalog
    requires:
      vars:
        - DATABRICKS_TEST_CATALOG
        - CONFIRM_TEST_CATALOG_RESET
    cmds:
      - uv run python -m github_engineering_analytics.common.catalog_reset --include-all

  dev:reset-all:
    desc: >-
      DESTRUCTIVE: like dev:reset-data, and also truncate the dbt-owned Gold
      relations, the daily snapshot tables and the replay manifests in the
      confirmed DEV catalog
    requires:
      vars:
        - DATABRICKS_DEV_CATALOG
        - CONFIRM_DEV_CATALOG_RESET
    cmds:
      - >-
        uv run python -m github_engineering_analytics.common.catalog_reset
        --catalog-environment-variable DATABRICKS_DEV_CATALOG
        --confirmation-environment-variable CONFIRM_DEV_CATALOG_RESET
        --include-all

  check:
    desc: Run all local quality checks
    deps:
      - lint
      - format:check
      - typecheck
      - test:unit
    cmds:
      - git diff --check

  bundle:validate:
    desc: Validate the development Databricks bundle
    cmds:
      - databricks bundle validate --target dev

  bundle:deploy:dev:
    desc: Deploy the development Databricks bundle
    cmds:
      - databricks bundle deploy --target dev

  bundle:validate:test:
    desc: Validate the TEST Databricks bundle
    cmds:
      - databricks bundle validate --target test

  bundle:deploy:test:
    desc: Deploy the TEST Databricks bundle (never implicit, run it on purpose)
    cmds:
      - databricks bundle deploy --target test

  replay:silver:test:
    desc: "Start a TEST Silver replay: task replay:silver:test -- manifest_id=<id>,execution_id=<new id>"
    cmds:
      - databricks bundle run --target test github_silver_replay --params {{.CLI_ARGS}}

  version:patch:
    desc: Create a local patch release commit and annotated tag
    env:
      PYTHONUTF8: "1"
    cmds:
      - uv run python -m bumpversion bump patch

  version:minor:
    desc: Create a local minor release commit and annotated tag
    env:
      PYTHONUTF8: "1"
    cmds:
      - uv run python -m bumpversion bump minor

  version:major:
    desc: Create a local major release commit and annotated tag
    env:
      PYTHONUTF8: "1"
    cmds:
      - uv run python -m bumpversion bump major

  version:show:
    desc: Show the current project version
    env:
      PYTHONUTF8: "1"
    cmds:
      - uv run python -m bumpversion show current_version

  version:show-bump:
    desc: Show the next major, minor, and patch versions without changing files
    env:
      PYTHONUTF8: "1"
    cmds:
      - uv run python -m bumpversion show-bump

  package:build:
    desc: Build the deployable Python wheel
    cmds:
      - uv build --wheel

  dbt:debug:
    desc: Test the local dbt connection to the test catalog
    cmds:
      - uv run dbt debug --project-dir dbt --profiles-dir dbt

  dbt:run-smoke:
    desc: Build and test the opt-in dbt connectivity smoke model
    cmds:
        - >-
            uv run dbt build --project-dir dbt --profiles-dir dbt
            --select tag:smoke --vars '{"enable_smoke_model": true}'

  dbt:test-sources:
    desc: Validate dbt source contracts for Python-owned Silver tables
    cmds:
      - uv run dbt test --project-dir dbt --profiles-dir dbt --select source:silver

  dbt:build-dim-date:
    desc: Build and test the Gold calendar dimension
    cmds:
      - uv run dbt build --project-dir dbt --profiles-dir dbt --select dim_date

  dbt:build-dim-repository:
    desc: Build and test the Gold repository dimension
    cmds:
      - >-
        uv run dbt build --project-dir dbt --profiles-dir dbt
        --select dim_repository

  dbt:build-dim-user:
    desc: Build and test the Gold user dimension
    cmds:
      - >-
        uv run dbt build --project-dir dbt --profiles-dir dbt
        --select dim_user

  dbt:build-dim-label:
    desc: Build and test the Gold label dimension
    cmds:
      - >-
        uv run dbt build --project-dir dbt --profiles-dir dbt
        --select dim_label

  dbt:build-bridge-issue-label:
    desc: Build and test the Gold Issue-to-Label bridge
    cmds:
      - >-
        uv run dbt build --project-dir dbt --profiles-dir dbt
        --select bridge_issue_label

  dbt:build-fact-issue:
    desc: Build and test the current-state Gold Issue fact
    cmds:
      - >-
        uv run dbt build --project-dir dbt --profiles-dir dbt
        --select fact_issue

  dbt:build-gold:
    desc: Build and test every current Gold dbt model
    cmds:
      - >-
        uv run dbt build --project-dir dbt --profiles-dir dbt
        --select tag:gold

  # The docs need the snapshot vars, because the staging models read them while
  # compiling. Pass them on the command line, for example:
  #   task dbt:docs SNAPSHOT_MANIFEST_ID=manifest-... SNAPSHOT_START_DATE=2026-10-12 SNAPSHOT_END_DATE=2026-10-16
  dbt:docs:
    desc: Generate the dbt documentation and catalog (needs the snapshot vars)
    requires:
      vars:
        - SNAPSHOT_MANIFEST_ID
        - SNAPSHOT_START_DATE
        - SNAPSHOT_END_DATE
    cmds:
      - >-
        uv run dbt docs generate --project-dir dbt --profiles-dir dbt
        --vars '{"snapshot_manifest_id": "{{.SNAPSHOT_MANIFEST_ID}}",
        "snapshot_start_date": "{{.SNAPSHOT_START_DATE}}",
        "snapshot_end_date": "{{.SNAPSHOT_END_DATE}}"}'

  dbt:docs:serve:
    desc: Open the dbt documentation in a local browser (needs the snapshot vars)
    requires:
      vars:
        - SNAPSHOT_MANIFEST_ID
        - SNAPSHOT_START_DATE
        - SNAPSHOT_END_DATE
    cmds:
      - >-
        uv run dbt docs serve --project-dir dbt --profiles-dir dbt
        --vars '{"snapshot_manifest_id": "{{.SNAPSHOT_MANIFEST_ID}}",
        "snapshot_start_date": "{{.SNAPSHOT_START_DATE}}",
        "snapshot_end_date": "{{.SNAPSHOT_END_DATE}}"}'

  monitor:health:test:
    desc: Show recent TEST pipeline lifecycles and committed watermarks
    requires:
      vars:
        - DATABRICKS_CONFIG_PROFILE
        - DATABRICKS_TEST_CATALOG
        - DATABRICKS_SQL_WAREHOUSE_ID
    cmds:
      - >-
        databricks experimental aitools tools query
        --profile {{.DATABRICKS_CONFIG_PROFILE}}
        --warehouse {{.DATABRICKS_SQL_WAREHOUSE_ID}}
        --param catalog={{.DATABRICKS_TEST_CATALOG}}
        --file scripts/pipeline_health.sql

  monitor:health:dev:
    desc: Show recent DEV pipeline lifecycles and committed watermarks
    requires:
      vars:
        - DATABRICKS_CONFIG_PROFILE
        - DATABRICKS_DEV_CATALOG
        - DATABRICKS_SQL_WAREHOUSE_ID
    cmds:
      - >-
        databricks experimental aitools tools query
        --profile {{.DATABRICKS_CONFIG_PROFILE}}
        --warehouse {{.DATABRICKS_SQL_WAREHOUSE_ID}}
        --param catalog={{.DATABRICKS_DEV_CATALOG}}
        --file scripts/pipeline_health.sql
