version: "3"

tasks:
  setup:
    desc: Install development dependencies
    env:
      UV_LINK_MODE: copy
    cmds:
      - uv sync --dev

  lint:
    desc: Run Ruff lint checks
    cmds:
      - uv run ruff check .

  format:
    desc: Format Python files with Ruff
    cmds:
      - uv run ruff format .

  format:check:
    desc: Check Python formatting without changing files
    cmds:
      - uv run ruff format --check .

  test:unit:
    desc: Run unit tests without Databricks
    cmds:
      - uv run pytest -m "not integration" -v

  test:integration:
    desc: Run opt-in Databricks integration tests
    requires:
      vars:
        - DATABRICKS_TEST_CATALOG
    cmds:
      - uv run pytest -m integration -v

  check:
    desc: Run all local quality checks
    deps:
      - lint
      - format:check
      - test:unit
    cmds:
      - git diff --check

  bundle:validate:
    desc: Validate the development Databricks bundle
    cmds:
      - databricks bundle validate --target dev

  bundle:deploy:dev:
    desc: Deploy the development Databricks bundle
    cmds:
      - databricks bundle deploy --target dev

  version:patch:
    desc: Create a local patch release commit and annotated tag
    env:
      PYTHONUTF8: "1"
    cmds:
      - uv run python -m bumpversion bump patch

  version:minor:
    desc: Create a local minor release commit and annotated tag
    env:
      PYTHONUTF8: "1"
    cmds:
      - uv run python -m bumpversion bump minor

  version:major:
    desc: Create a local major release commit and annotated tag
    env:
      PYTHONUTF8: "1"
    cmds:
      - uv run python -m bumpversion bump major

  version:show:
    desc: Show the current project version
    env:
      PYTHONUTF8: "1"
    cmds:
      - uv run python -m bumpversion show current_version

  version:show-bump:
    desc: Show the next major, minor, and patch versions without changing files
    env:
      PYTHONUTF8: "1"
    cmds:
      - uv run python -m bumpversion show-bump

  package:build:
    desc: Build the deployable Python wheel
    cmds:
      - uv build --wheel
