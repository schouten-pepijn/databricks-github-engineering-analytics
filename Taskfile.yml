version: "3"

tasks:
  setup:
    desc: Install development dependencies
    cmds:
      - uv sync --dev

  lint:
    desc: Run Ruff lint checks
    cmds:
      - uv run ruff check .

  format:
    desc: Format Python files with Ruff
    cmds:
      - uv run ruff format .

  format:check:
    desc: Check Python formatting without changing files
    cmds:
      - uv run ruff format --check .

  test:unit:
    desc: Run unit tests without Databricks
    cmds:
      - uv run pytest -m "not integration" -v

  test:integration:
    desc: Run opt-in Databricks integration tests
    requires:
      vars:
        - DATABRICKS_TEST_CATALOG
    cmds:
      - uv run pytest -m integration -v

  check:
    desc: Run all local quality checks
    deps:
      - lint
      - format:check
      - test:unit
    cmds:
      - git diff --check

  bundle:validate:
    desc: Validate the development Databricks bundle
    cmds:
      - databricks bundle validate --target dev

  bundle:deploy:dev:
    desc: Deploy the development Databricks bundle
    cmds:
      - databricks bundle deploy --target dev

  version:patch:
    desc: Bump the patch version, for example 0.0.1 to 0.0.2
    cmds:
      - uv version --bump patch

  version:minor:
    desc: Bump the minor version, for example 0.0.1 to 0.1.0
    cmds:
      - uv version --bump minor

  version:major:
    desc: Bump the major version, for example 0.0.1 to 1.0.0
    cmds:
      - uv version --bump major

  version:show:
    desc: Show the current project version
    cmds:
      - uv version --short
