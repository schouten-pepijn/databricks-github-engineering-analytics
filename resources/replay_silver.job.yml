resources:
  jobs:
    github_silver_replay:
      name: "[TEST] GitHub Silver replay"
      description: >-
        TEST ONLY, started by hand. Replays one stored manifest into isolated
        Silver candidate tables in github_analytics_v2min. It reads Bronze at the
        version the manifest pinned. It never calls GitHub and never writes live
        Silver, the control tables or the extraction watermark.

      # One replay at a time keeps the TEST compute and the output tables easy to
      # reason about.
      max_concurrent_runs: 1

      # Supplied when the job is started:
      #   databricks bundle run -t test github_silver_replay \
      #     --params manifest_id=<manifest id>,execution_id=<new id>
      # An empty default makes a forgotten value fail loudly, not silently.
      parameters:
        - name: manifest_id
          default: ""
        - name: execution_id
          default: ""

      tasks:
        - task_key: replay_silver
          environment_key: python

          # A retry after a partial write would meet its own half-written tables
          # and stop at the pre-flight check, so do not retry automatically.
          max_retries: 0

          python_wheel_task:
            package_name: github_engineering_analytics
            entry_point: github-engineering-analytics-replay-silver
            # Only the catalog is a named parameter. manifest_id and execution_id
            # are job parameters, and Databricks already hands those to a wheel
            # task as --manifest_id and --execution_id. Repeating them here would
            # pass every value twice under two different spellings.
            named_parameters:
              catalog: ${var.catalog}

      environments:
        - environment_key: python
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/*.whl
